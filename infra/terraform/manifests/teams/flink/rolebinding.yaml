apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${team_name}-role-binding
  namespace: ${namespace}
subjects:
- kind: ServiceAccount
  name: ${service_account}
  namespace: ${namespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${team_name}-role
