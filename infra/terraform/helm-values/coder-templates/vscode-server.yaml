# VSCode Server Template for Coder
# Web IDE with file browser integration

workspace:
  name: "vscode-workspace"
  class: "data-science"
  resource_class: "data-science"

  # VSCode configuration
  image: "${vscode_image}"

  # File browser integration
  file_browser:
    enabled: true
    path: "/home/coder/workspace"
    max_depth: 5

  # S3/Glue access through pod identity
  pod:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: "${iam_role_arn}"
